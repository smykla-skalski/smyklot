<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <meta name="smyklot-panel-base" content="/__smyklot_panel_base__" />
    <meta name="smyklot-panel-version" content="__smyklot_panel_version__" />
    <meta name="smyklot-panel-service" content="__smyklot_panel_service__" />
    <!-- Empty on every page the panel means to serve. The server fills it in when
         it is answering with an error instead, so the page that boots knows what
         happened without a second request. -->
    <meta name="smyklot-panel-error" content="__smyklot_panel_error__" />

    <title>SMYKLOT</title>
    <meta name="application-name" content="SMYKLOT" />
    <meta
      name="description"
      content="Manage Smyklot installations, repositories, access, and runtime settings"
    />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="format-detection" content="telephone=no" />

    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1116" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7f6" />

    <link
      rel="preload"
      href="/src/assets/fonts/PlusJakartaSansLatinVF.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- The vector is the mark; the raster is the fallback, so it is declared
         first and only browsers that cannot read the SVG stop there. The home
         screen icon has no choice: `apple-touch-icon` does not accept SVG. -->
    <link
      rel="icon"
      type="image/png"
      sizes="256x256"
      href="/__smyklot_panel_base__/smyklot-avatar.png?v=__smyklot_panel_version__"
    />
    <link rel="icon" type="image/svg+xml" href="/src/assets/smyklot-halo.svg" />
    <link
      rel="apple-touch-icon"
      sizes="256x256"
      href="/__smyklot_panel_base__/smyklot-avatar.png?v=__smyklot_panel_version__"
    />
    <meta name="apple-mobile-web-app-title" content="SMYKLOT" />
  </head>
  <body>
    <div id="app"></div>
    <!-- The panel is a mounted application, so without scripting there is no page
         to fall back to. An error document says which error it was here, because
         that is the one case where the reader has been told nothing else. -->
    <noscript>__smyklot_panel_noscript__</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
