branches:
  - main

plugins:
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      releaseRules:
        - type: feat
          release: minor
        - type: fix
          release: patch
        - type: perf
          release: patch
        - type: refactor
          release: patch
        - type: docs
          release: false
        - type: style
          release: false
        - type: chore
          release: false
        - type: test
          release: false
        - type: ci
          release: false
        - type: build
          release: false

  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits
      presetConfig:
        types:
          - type: feat
            section: Features
          - type: fix
            section: Bug Fixes
          - type: perf
            section: Performance Improvements
          - type: refactor
            section: Code Refactoring
          - type: docs
            hidden: true
          - type: style
            hidden: true
          - type: chore
            hidden: true
          - type: test
            hidden: true
          - type: ci
            hidden: true
          - type: build
            hidden: true

  - - "@semantic-release/changelog"
    - changelogFile: CHANGELOG.md
      changelogTitle: "# Changelog"

  - - "@semantic-release/exec"
    # The chart is versioned with the binary it deploys, so `helm install
    # --version X` and `smyklot:X` are always the same release
    - prepareCmd: >-
        perl -i -pe 's|smyklot:[0-9]+\.[0-9]+\.[0-9]+|smyklot:${nextRelease.version}|g' action.yml &&
        perl -i -pe 's|^version: .*|version: ${nextRelease.version}|;
        s|^appVersion: .*|appVersion: "${nextRelease.version}"|' charts/smyklot/Chart.yaml

  - - "@semantic-release/git"
    - assets:
        - CHANGELOG.md
        - action.yml
        - charts/smyklot/Chart.yaml
      message: "chore(release): bump version to ${nextRelease.version}\n\n${nextRelease.notes}"

  - - "@semantic-release/github"
    - successComment: "🎉 Shipped in [**v${nextRelease.version}**](${releases[0].url})"
