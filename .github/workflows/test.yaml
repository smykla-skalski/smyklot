name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04

    # The storage suite runs against both engines, and the PostgreSQL half
    # skips itself when there is no server. A skip that CI accepted would mean
    # the second engine was never tested, so the server is provided here and a
    # step below fails if the suite skipped anyway.
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: smyklot
          POSTGRES_PASSWORD: smyklot
          POSTGRES_DB: smyklot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smyklot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: true

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        run: mise run test

      # The step above sets no DSN, so it is the SQLite pass. This is the
      # PostgreSQL one, and it fails if any spec skipped rather than ran.
      - name: Run tests against PostgreSQL
        env:
          SMYKLOT_TEST_POSTGRES_DSN: postgres://smyklot:smyklot@localhost:5432/smyklot?sslmode=disable
        run: mise run test:storage:postgres

      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned, and matching .mise.toml, so a local run sees what CI sees.
          # On "latest" a new upstream rule fails a pull request that never
          # touched the code it fires on
          version: v2.12.2

      - name: Verify modules
        run: mise run lint:mod

      - name: Lint the Helm chart
        run: mise run lint:helm

      - name: Lint shell scripts
        run: mise run lint:shell

      # The deploy workflow's own checks. Nothing else runs them until a
      # release does, and by then the only thing they can report is that the
      # release failed.
      - name: Test the deploy checks
        run: mise run test:deploy
