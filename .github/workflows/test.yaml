name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release gate is this workflow, called. A release must have passed what a
  # pull request passes, and writing that list down a second time is writing a
  # list that drifts from this one.
  workflow_call:
    inputs:
      concurrency-group:
        description: >-
          The group this run keys its concurrency on. Required, because the
          default below is keyed on the ref and a caller shares its ref with the
          runs this workflow starts for itself: a release dispatched on main
          would queue behind the push run for the same commit, and the push
          after that would cancel it while it waited.
        required: true
        type: string

permissions:
  contents: read

# A superseded pull request run is a run nobody is waiting for any more. Pushes
# to main are left alone: a release is cut from a commit that has proved itself,
# so cancelling one would leave main with nothing to have proved it. A called
# run is left alone for the same reason and a plainer one - a release is blocked
# on it, so nothing about it is superseded.
concurrency:
  group: ${{ inputs.concurrency-group || format('test-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.concurrency-group }}

jobs:
  # One job per area, because ginkgo runs one suite at a time. Giving each area
  # its own runner is the only parallelism available between suites, and `-p`
  # inside each is the only parallelism available within one.
  #
  # The areas are split by what they cost rather than by what they mean:
  # cmd/github-action and internal/panel are each about as expensive as
  # everything under pkg put together.
  go:
    name: go (${{ matrix.area }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: service
            dirs: ./cmd/github-action
          - area: panel
            dirs: ./internal/panel ./internal/panelassets ./internal/storage/transfer
          - area: storage
            dirs: ./internal/storage/sqlite ./internal/storage/postgres
          - area: packages
            dirs: >-
              ./pkg ./internal/pendingci ./internal/orgsync ./internal/configgen
              ./internal/storage/sqlstore

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install the toolchain
        uses: ./.github/actions/toolchain
        with:
          go-cache: ${{ matrix.area }}

      # No DSN, so this is the SQLite pass.
      - name: Run the suite
        run: mise run test ${{ matrix.dirs }}

  # The second engine. Everything above the port opens whichever one the
  # environment names, so these are the same suites again against PostgreSQL -
  # which is the only thing that proves the port is a port.
  postgres:
    name: postgres (${{ matrix.area }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The storage suite skips itself when there is no server, and a skip
          # is not proof, so this task fails when one skipped.
          - area: storage
            task: test:storage:postgres
            dirs: ''
          - area: service
            task: test:postgres
            dirs: ./cmd/github-action
          - area: panel
            task: test:postgres
            dirs: ./internal/panel

    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: smyklot
          POSTGRES_PASSWORD: smyklot
          POSTGRES_DB: smyklot
          # The cluster lives in RAM and is built without waiting for a disk it
          # does not have. Every spec above the port creates a schema and replays
          # the migration series into it, which is almost all write, and a test
          # database has nothing to survive a crash for - the next run builds it
          # again from nothing either way.
          PGDATA: /dev/shm/pgdata
          POSTGRES_INITDB_ARGS: --no-sync
        ports:
          - 5432:5432
        # A one second interval, not five: the container is ready long before the
        # first check under a five second one, and every job here waits for it
        # before its first step runs. The shared memory is sized for the cluster
        # above, which the 64MB default is far too small for.
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U smyklot"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 60

    env:
      SMYKLOT_TEST_POSTGRES_DSN: postgres://smyklot:smyklot@localhost:5432/smyklot?sslmode=disable

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install the toolchain
        uses: ./.github/actions/toolchain
        with:
          go-cache: postgres-${{ matrix.area }}

      - name: Run the suite
        run: mise run ${{ matrix.task }} ${{ matrix.dirs }}

  lint:
    name: lint (go)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install the toolchain
        uses: ./.github/actions/toolchain
        with:
          go-cache: lint

      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned, and matching .mise.toml, so a local run sees what CI sees.
          # On "latest" a new upstream rule fails a pull request that never
          # touched the code it fires on
          version: v2.12.2

  # The checks that cost seconds each. They are one job because the runner takes
  # longer to acquire than all of them take to run.
  checks:
    name: checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install the toolchain
        uses: ./.github/actions/toolchain
        with:
          go-cache: checks

      - name: Verify modules
        run: mise run lint:mod

      - name: Lint the Helm chart
        run: mise run lint:helm

      - name: Lint shell scripts
        run: mise run lint:shell

      - name: Lint the workflows
        run: mise run lint:actions

      # actionlint above says the workflow is valid. This says it is complete:
      # the go matrix names the directories it runs, and a new package can be
      # left out of that list without anything here going red.
      - name: Check the matrix runs every suite
        run: mise run lint:matrix

      # A release config that swallows a breaking change ships one to everybody
      # pinned to the major it broke, and the release itself looks fine.
      - name: Check a breaking change releases a major
        run: mise run lint:release

      - name: Lint Markdown
        run: mise run lint:markdown

      # The deploy workflow's own checks. Nothing else runs them until a
      # release does, and by then the only thing they can report is that the
      # release failed.
      - name: Test the deploy checks
        run: mise run test:deploy

      - name: Test panel dependency cache restoration
        run: mise run test:panel-install

  frontend:
    name: frontend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install the toolchain
        uses: ./.github/actions/toolchain

      # The install script stamps node_modules with the manifest it installed
      # from, so a restored directory makes `npm ci` a no-op rather than a
      # repeat.
      - name: Restore the panel's dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: internal/panel/frontend/node_modules
          key: ${{ runner.os }}-panel-npm-${{ hashFiles('internal/panel/frontend/package-lock.json') }}

      - name: Lint the panel
        run: mise run panel:frontend:lint

      - name: Test the panel
        run: mise run panel:frontend:test

  # The panel driven in Chrome, counting what it asks the server for. Its own
  # job because it costs ten times what the unit tests cost, and because it is
  # the only check here that needs a browser: the runner image ships Chrome, so
  # nothing is downloaded to get one.
  budget:
    name: request budget
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install the toolchain
        uses: ./.github/actions/toolchain

      - name: Restore the panel's dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: internal/panel/frontend/node_modules
          key: ${{ runner.os }}-panel-npm-${{ hashFiles('internal/panel/frontend/package-lock.json') }}

      - name: Count what the panel asks for
        run: mise run panel:frontend:test:browser
