# Rolls the running service onto a released image.
#
# Runs after the release image publishes, so the service, image, and release
# notes always describe the same build. It can also be dispatched with an
# explicit version to roll back without waiting for another release.

name: Deploy

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to deploy, without the leading v'
        required: true
        type: string
    secrets:
      # Scoped to the service app, so it cannot read the database app - which
      # is the point. Two tokens rather than one org-wide token means the
      # release pipeline can replace the service and can change nothing else.
      FLY_API_TOKEN:
        required: true
      FLY_DB_READ_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy, without the leading v (for example 1.13.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # One deploy at a time. Two would fight over the single machine the service
  # is deliberately limited to
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      # Which backend the app is on decides what "healthy" looks like, so it is
      # read from the app rather than assumed. SMYKLOT_DATABASE_URL is set as a
      # secret at cutover and is the only durable marker of which one is live.
      - name: Identify the storage backend
        id: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          secrets="$(flyctl secrets list --app smyklot --json)"

          # Prove the query works before believing its answer. Absence is what
          # selects SQLite, so every way of reading nothing - a renamed field, a
          # wrong app, an flyctl that changed its output - says SQLite just as
          # confidently as a service that really is on SQLite. That is the
          # dangerous direction: it verifies a volume the app no longer has and
          # skips the check that the database is even up.
          #
          # serve refuses to start without SMYKLOT_WEBHOOK_SECRET, so it is
          # present on any app that is running, whichever backend it uses.
          if ! jq -e 'any(.[]; .name == "SMYKLOT_WEBHOOK_SECRET")' <<<"$secrets" >/dev/null; then
            echo "cannot read the app's secrets, so the backend cannot be identified" >&2
            printf '%s\n' "$secrets" >&2
            exit 1
          fi

          if jq -e 'any(.[]; .name == "SMYKLOT_DATABASE_URL")' <<<"$secrets" >/dev/null; then
            echo "backend=postgres" >>"$GITHUB_OUTPUT"
            echo "Service state is in PostgreSQL."
          else
            echo "backend=sqlite" >>"$GITHUB_OUTPUT"
            echo "Service state is in SQLite on a volume."
          fi

      # The service is a single writer on either backend - deliveries are
      # de-duplicated in memory and the sweep has no leader election. Only the
      # volume half of that is SQLite's, so only the volume half is skipped.
      - name: Verify the single writer topology
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          BACKEND: ${{ steps.backend.outputs.backend }}
        run: |
          set -euo pipefail
          machines="$(flyctl machines list --app smyklot --json)"
          machine_count="$(jq '[.[] | select(.config.env.FLY_PROCESS_GROUP == "app")] | length' <<<"$machines")"
          if [[ "$machine_count" -gt 1 ]]; then
            echo "expected at most one app machine, found $machine_count; reconcile machines and volumes manually" >&2
            exit 1
          fi
          machine_id="$(jq -r '.[] | select(.config.env.FLY_PROCESS_GROUP == "app") | .id' <<<"$machines")"

          if [[ "$BACKEND" != "sqlite" ]]; then
            exit 0
          fi

          volumes="$(flyctl volumes list --app smyklot --json)"
          volume_count="$(jq '[.[] | select(.name == "smyklot_data")] | length' <<<"$volumes")"
          if [[ "$volume_count" -ne 1 ]]; then
            echo "expected exactly one smyklot_data volume, found $volume_count" >&2
            exit 1
          fi
          attached_machine="$(jq -r '.[] | select(.name == "smyklot_data") | .attached_machine_id // ""' <<<"$volumes")"
          if [[ -n "$attached_machine" && "$attached_machine" != "$machine_id" ]]; then
            echo "smyklot_data is attached to unexpected machine $attached_machine" >&2
            exit 1
          fi

      # The volume moved to another app, so what has to be true moved with it:
      # the database has to be up before the service is replaced. Deploying
      # into an unreachable database gives a machine that fails its migrations
      # on start and never becomes ready.
      #
      # A different token, because the deploy token is scoped to smyklot and
      # cannot see smyklot-db. This one is the mirror of it: scoped to the
      # database app, and read-only, so the pipeline that reads the database's
      # health has no way to change the database.
      - name: Verify the database is up
        if: steps.backend.outputs.backend == 'postgres'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DB_READ_TOKEN }}
        run: |
          set -euo pipefail

          # Name the likely cause rather than passing flyctl's "unauthorized"
          # along. This step read smyklot-db with the service's deploy token
          # once, and an app-scoped token refusing another app looks like the
          # database being gone rather than the token being the wrong one.
          if ! machines="$(flyctl machines list --app smyklot-db --json 2>&1)"; then
            echo "cannot read smyklot-db: $machines" >&2
            echo "FLY_DB_READ_TOKEN must be scoped to smyklot-db; see DEPLOYMENT.md" >&2
            exit 1
          fi

          started="$(jq '[.[] | select(.state == "started")] | length' <<<"$machines")"
          if [[ "$started" -ne 1 ]]; then
            echo "expected exactly one started smyklot-db machine, found $started" >&2
            flyctl status --app smyklot-db >&2 || true
            exit 1
          fi
          # Counted rather than filtered for failures, because a machine that
          # reports no checks at all would pass a "nothing is failing" test
          # while saying nothing about whether Postgres is accepting queries.
          checks="$(jq '[.[] | select(.state == "started") | .checks // []] | add // []' <<<"$machines")"
          total="$(jq 'length' <<<"$checks")"
          passing="$(jq '[.[] | select(.status == "passing")] | length' <<<"$checks")"
          if [[ "$total" -eq 0 || "$passing" -ne "$total" ]]; then
            echo "expected every smyklot-db health check to pass, found $passing of $total" >&2
            flyctl checks list --app smyklot-db >&2 || true
            exit 1
          fi

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          flyctl deploy \
            --app smyklot \
            --ha=false \
            --image "ghcr.io/smykla-skalski/smyklot:${VERSION}" \
            --wait-timeout 300

      - name: Verify the service and panel
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VERSION: ${{ inputs.version }}
          BACKEND: ${{ steps.backend.outputs.backend }}
        run: |
          set -euo pipefail
          flyctl status --app smyklot
          machines="$(flyctl machines list --app smyklot --json)"
          machine_count="$(jq '[.[] | select(.config.env.FLY_PROCESS_GROUP == "app")] | length' <<<"$machines")"
          if [[ "$machine_count" -ne 1 ]]; then
            echo "deploy left $machine_count app machines; refusing to accept a second writer" >&2
            exit 1
          fi
          machine_id="$(jq -r '.[] | select(.config.env.FLY_PROCESS_GROUP == "app") | .id' <<<"$machines")"
          expected_image="ghcr.io/smykla-skalski/smyklot:${VERSION}"
          deployed_image="$(jq -r '.[] | select(.config.env.FLY_PROCESS_GROUP == "app") | .config.image' <<<"$machines")"
          if [[ "$deployed_image" != "$expected_image" ]]; then
            echo "expected image $expected_image, found $deployed_image" >&2
            exit 1
          fi

          if [[ "$BACKEND" == "sqlite" ]]; then
            volumes="$(flyctl volumes list --app smyklot --json)"
            volume_count="$(jq '[.[] | select(.name == "smyklot_data")] | length' <<<"$volumes")"
            if [[ "$volume_count" -ne 1 ]]; then
              echo "deploy left $volume_count smyklot_data volumes" >&2
              exit 1
            fi
            attached_machine="$(jq -r '.[] | select(.name == "smyklot_data") | .attached_machine_id // ""' <<<"$volumes")"
            if [[ "$attached_machine" != "$machine_id" ]]; then
              echo "smyklot_data is not attached to the sole app machine $machine_id" >&2
              exit 1
            fi
          else
            # A volume left behind after the cutover is not an error, but it is
            # worth saying: it is the old SQLite state, and it still costs
            # money until someone destroys it.
            leftover="$(flyctl volumes list --app smyklot --json \
              | jq '[.[] | select(.name == "smyklot_data")] | length')"
            if [[ "$leftover" -gt 0 ]]; then
              echo "::notice::$leftover smyklot_data volume(s) remain after the move to PostgreSQL;" \
                "destroy them once a backup has been kept"
            fi
          fi
          flyctl proxy 19090:9090 --app smyklot --quiet >fly-proxy.log 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          curl --fail --show-error --silent --retry 12 --retry-all-errors \
            --retry-delay 5 http://127.0.0.1:19090/readyz >/dev/null
          curl --fail --show-error --silent --retry 12 --retry-all-errors \
            --retry-delay 5 https://smyklot.com/healthz >/dev/null
          curl --fail --show-error --silent --retry 12 --retry-all-errors \
            --retry-delay 5 https://smyklot.com/ >/dev/null
          location="$(curl --show-error --silent --output /dev/null \
            --write-out '%{redirect_url}' https://smyklot.com/auth/github/start)"
          case "$location" in
            https://github.com/login/oauth/authorize*) ;;
            *)
              echo "panel sign-in did not redirect to GitHub: $location" >&2
              exit 1
              ;;
          esac
