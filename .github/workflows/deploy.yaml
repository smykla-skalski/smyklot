# Rolls the running service onto a released image.
#
# Runs after a release publishes, so the service and the release notes always
# describe the same build. Can also be dispatched with an explicit version to
# roll back without waiting for another release.

name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy, without the leading v (for example 1.13.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # One deploy at a time. Two would fight over the single machine the service
  # is deliberately limited to
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Resolve version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "release" ]; then
            echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${INPUT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          flyctl deploy \
            --image "ghcr.io/smykla-skalski/smyklot:${VERSION}" \
            --wait-timeout 300

      - name: Verify it came back
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl status --app smyklot
