# Release workflow for smyklot
# Triggers on PR merge with release labels, daily at 10 AM UTC, or manually

name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  schedule:
    # Run daily at 10 AM UTC
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Releases must enter semantic-release and image publication in order. Merely
# serializing the final deploy would let a slower older image arrive after a
# newer one and roll production backward.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Check if workflow should proceed
  check:
    name: Check Conditions
    runs-on: ubuntu-24.04
    if: |
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release') ||
        contains(github.event.pull_request.labels.*.name, 'release/major') ||
        contains(github.event.pull_request.labels.*.name, 'release/minor') ||
        contains(github.event.pull_request.labels.*.name, 'release/patch')))
    steps:
      - name: Conditions met
        run: echo "Workflow conditions met, proceeding with release process"

  # Run tests
  test:
    needs: check
    name: Test
    runs-on: ubuntu-24.04
    env:
      MISE_ENV: ci

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true

      - name: Run tests
        run: task test

  # Run golangci-lint
  golangci-lint:
    needs: check
    name: Go Lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  # Run markdownlint
  markdownlint:
    needs: check
    name: Markdown Lint
    runs-on: ubuntu-24.04
    env:
      MISE_ENV: ci

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true

      - name: Run markdownlint
        run: task lint:markdown

  # Verify go.mod
  go-mod-verify:
    needs: check
    name: Go Mod Verify
    runs-on: ubuntu-24.04
    env:
      MISE_ENV: ci

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true

      - name: Verify go.mod
        run: task lint:mod

  # The panel ships inside the Go binary, so its independent TypeScript,
  # Svelte and production-build gates must pass before semantic-release can
  # publish an image containing it.
  panel-frontend:
    needs: check
    name: Panel Frontend
    runs-on: ubuntu-24.04
    env:
      MISE_ENV: ci

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true

      - name: Lint and type-check
        run: mise run panel:frontend:lint

      - name: Test
        run: mise run panel:frontend:test

      - name: Build
        run: mise run panel:frontend:build

  # Determine if a release should be created
  release:
    name: Semantic Release
    runs-on: ubuntu-24.04
    needs: [test, golangci-lint, markdownlint, go-mod-verify, panel-frontend]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}

    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SMYKLOT_CLIENT_ID || 'Iv23liMyF31aNYay8IXy' }}
          private-key: ${{ secrets.SMYKLOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/exec
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: smyklot[bot]
          GIT_AUTHOR_EMAIL: 205507218+smyklot[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: smyklot[bot]
          GIT_COMMITTER_EMAIL: 205507218+smyklot[bot]@users.noreply.github.com

  # Build and release binaries with GoReleaser
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-24.04
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.new_release_git_tag }}

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-fly:
    name: Deploy to Fly
    needs: [release, goreleaser]
    if: needs.goreleaser.result == 'success'
    uses: ./.github/workflows/deploy.yaml
    with:
      version: ${{ needs.release.outputs.new_release_version }}
    secrets: inherit

  # Package and publish the Helm chart
  #
  # Runs after goreleaser so the chart is never published pointing at an image
  # that does not exist yet
  helm-chart:
    name: Helm Chart
    runs-on: ubuntu-24.04
    needs: [release, goreleaser]
    if: needs.goreleaser.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.new_release_git_tag }}

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true

      - name: Login to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io \
            --username "$OWNER" --password-stdin

      # Chart.yaml already carries this release's version: semantic-release
      # rewrites it and commits it under the tag checked out above
      - name: Package and push chart
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          helm package charts/smyklot --destination dist
          helm push "dist/smyklot-${VERSION}.tgz" oci://ghcr.io/smykla-skalski/charts

  # Notify organization repositories of new release
  notify-org:
    name: Notify Org
    runs-on: ubuntu-24.04
    needs: [release, goreleaser]
    if: needs.goreleaser.result == 'success'

    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SMYKLOT_CLIENT_ID || 'Iv23liMyF31aNYay8IXy' }}
          private-key: ${{ secrets.SMYKLOT_APP_PRIVATE_KEY }}
          owner: smykla-skalski
          repositories: .github

      - name: Trigger smyklot sync
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.release.outputs.new_release_version }}
          TAG: ${{ needs.release.outputs.new_release_git_tag }}
        run: |
          jq -nc \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            '{event_type: "smyklot-release", client_payload: {version: $version, tag: $tag}}' \
          | gh api repos/smykla-skalski/.github/dispatches --input -
