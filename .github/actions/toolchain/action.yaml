name: Toolchain
description: Install the versions pinned in .mise.toml and restore one job's Go caches

# Every job in the test workflow needs the same two things, and GitHub Actions
# has no anchors, so without this the setup would be copied into each of them
# and would drift the first time one was changed.

inputs:
  go-cache:
    description: >-
      Cache namespace for the Go build and module caches. A job caches only what
      it compiles, so the archive it restores is its own work rather than the
      whole repository's. Leave it empty in a job that builds no Go.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install mise
      uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      with:
        cache: true

    # The key carries go.sum rather than the commit, so it is written once and
    # then hit by every later run: Go's build cache is content addressed, and
    # what it saves is the compilation of dependencies and of the race
    # instrumented standard library, neither of which a change in this
    # repository invalidates. The second restore key is what makes a new area
    # start from a sibling's archive instead of from nothing.
    - name: Restore the Go caches
      if: inputs.go-cache != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ inputs.go-cache }}-${{ hashFiles('go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ inputs.go-cache }}-
          ${{ runner.os }}-go-
