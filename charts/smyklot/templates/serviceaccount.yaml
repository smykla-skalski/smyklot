{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "smyklot.serviceAccountName" . }}
  labels:
    {{- include "smyklot.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The service talks to GitHub, never to the Kubernetes API
automountServiceAccountToken: false
{{- end }}
