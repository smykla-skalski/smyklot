# Fly.io deployment for the webhook service.
#
# The image is the one a release publishes, so what runs here is what the
# release notes describe. Deploy a specific version rather than latest:
#
#   fly deploy --image ghcr.io/smykla-skalski/smyklot:1.13.0
#
# Secrets are never in this file. They are set once with `fly secrets set` and
# live encrypted in Fly:
#
#   SMYKLOT_WEBHOOK_SECRET, GITHUB_APP_PRIVATE_KEY, GITHUB_APP_CLIENT_ID,
#   SMYKLOT_PANEL_CLIENT_ID, SMYKLOT_PANEL_CLIENT_SECRET
#
# The panel pair belongs to a classic OAuth App, registered apart from the
# GitHub App so that signing in to read the panel does not ask anyone to grant
# the permissions the bot approves and merges with

app = "smyklot"
primary_region = "fra"

# The image's entrypoint is the bare binary, whose root command is the Action.
# Without this the machine prints the help text and exits 1
[processes]
  app = "serve"

# There is no build section on purpose. The binary is built and published by
# the release pipeline, and `fly deploy --image` names which one to run.

[deploy]
  # Rolling replaces the one machine in place. Blue-green and canary both start
  # a second machine, but this v1 SQLite deployment deliberately has one volume
  # and one writer. The deployment workflow refuses unsafe topologies rather
  # than guessing which volume-backed machine contains canonical state.
  strategy = "rolling"

[env]
  SMYKLOT_LISTEN_ADDRESS = ":8080"
  SMYKLOT_ADMIN_ADDRESS = ":9090"
  SMYKLOT_WEBHOOK_PATH = "/webhook"
  SMYKLOT_POLL_INTERVAL = "5m"
  SMYKLOT_LOG_FORMAT = "json"
  SMYKLOT_LOG_LEVEL = "info"
  SMYKLOT_PANEL_PUBLIC_ORIGIN = "https://smyklot.com"
  SMYKLOT_PANEL_BASE_PATH = "/"
  SMYKLOT_PANEL_STATE_PATH = "/data/panel.sqlite3"
  SMYKLOT_PANEL_SUPER_ROOT_ID = "11655498"

  # The Go runtime cannot see the machine's memory limit, so it is told.
  # Measured idle is ~17MB and ~23MB under a burst, so 200MiB leaves the
  # collector room without ever approaching the 256MB the machine has
  GOMEMLIMIT = "200MiB"

# Webhook deliveries, and the only thing published. Everything an operator
# reads is on 9090, which no service here exposes: reach it over the private
# network with `fly proxy 9090 -a smyklot`
[http_service]
  internal_port = 8080
  force_https = true
  processes = ["app"]

  # The sweep is what makes reaction commands work, and a stopped machine runs
  # no timers. This is why the service cannot scale to zero
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"

    # A delivery is answered before its command runs, so these are only ever
    # brief. The queue behind them is what actually bounds the work
    soft_limit = 50
    hard_limit = 100

# /livez on the public port would be one more thing reachable from the
# internet, so the check uses /healthz, which exists for exactly this
[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

# The panel's owner binding, settings, audit trail and delivery history are
# durable. SQLite is intentionally single-writer in v1, matching the one Fly
# Machine enforced below.
[[mounts]]
  source = "smyklot_data"
  destination = "/data"
  initial_size = "1GB"
  snapshot_retention = 14

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
