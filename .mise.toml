# mise configuration - pinned tools and native repository workflows

[tools]
go = "1.26.6"
node = "24.19.0"
"npm:markdownlint-cli2" = "0.23.2"
"go:github.com/onsi/ginkgo/v2/ginkgo" = "2.32.1"
actionlint = "1.7.12"
golangci-lint = "2.12.2"
helm = "4.2.4"
shellcheck = "0.11.0"
yq = "4.53.3"

[env]
GO111MODULE = "on"
GOFLAGS = "-mod=readonly"
CGO_ENABLED = "0"

# -p, and everywhere. Ginkgo runs one suite at a time, and without it the specs
# inside each are serial too - which is how the two slowest packages alone came
# to take longer than the whole CI job is now allowed. Directories may be named
# to run a subset; CI names one per job so the suites run concurrently, which is
# the parallelism ginkgo itself does not have.
[tasks.test]
description = "Run the Go suite with race detection - every directory, or only the ones named"
depends = ["panel:assets:generate"]
env = { CGO_ENABLED = "1" }
run = 'ginkgo -r -p --race --fail-on-empty {{arg(name="dirs", var=true, default=".")}}'

[tasks."test:cover"]
description = "Run the whole Go suite and write an HTML coverage report"
depends = ["panel:assets:generate"]
env = { CGO_ENABLED = "1" }
run = '''
mkdir -p tmp/coverage
ginkgo -r -p --cover --race --output-dir=tmp/coverage --coverprofile=coverage.out
go tool cover -html=tmp/coverage/coverage.out -o tmp/coverage/coverage.html
'''

[tasks."test:unit"]
description = "Run Smyklot unit tests with race detection and coverage"
depends = ["panel:assets:generate"]
env = { CGO_ENABLED = "1" }
run = '''
mkdir -p tmp/coverage/unit
ginkgo -r --focus='\[Unit\]' --fail-on-empty --cover --race \
  --output-dir=tmp/coverage/unit --coverprofile=coverage.out
'''

[tasks."test:watch"]
description = "Run tests in watch mode"
depends = ["panel:assets:generate"]
env = { CGO_ENABLED = "1" }
run = "ginkgo watch -r"

[tasks."test:deploy"]
description = "Run the deploy workflow's checks against canned flyctl answers"
run = "./scripts/test-deploy-steps.sh"

[tasks."test:storage"]
description = "Run the shared storage suite against every engine"
env = { CGO_ENABLED = "1" }
run = "ginkgo -r --race --fail-on-empty ./internal/storage"

[tasks."test:storage:postgres"]
description = "Run the storage suite against PostgreSQL, failing if it skipped"
depends = ["panel:assets:generate"]
env = { CGO_ENABLED = "1" }
run = '''
set -eu

if [ -z "${SMYKLOT_TEST_POSTGRES_DSN:-}" ]; then
  echo "SMYKLOT_TEST_POSTGRES_DSN is not set; run 'mise run db:dev' first" >&2
  exit 1
fi

mkdir -p tmp/storage
ginkgo -p --race --fail-on-empty \
  --json-report=postgres.json --output-dir=tmp/storage \
  ./internal/storage/postgres

# The suite skips itself when there is no server, and a skip is not proof.
# --fail-on-empty does not cover this: the specs were found, they just did not
# run. Without this check a misconfigured DSN would look exactly like a pass.
report=tmp/storage/postgres.json
skipped="$(jq '[.[].SpecReports[]? | select(.State == "skipped")] | length' "$report")"
passed="$(jq '[.[].SpecReports[]? | select(.State == "passed")] | length' "$report")"

if [ "$skipped" -gt 0 ]; then
  echo "$skipped PostgreSQL spec(s) skipped; the engine was not actually tested" >&2
  jq -r '.[].SpecReports[]? | select(.State == "skipped")
    | "  " + (.ContainerHierarchyTexts | join(" ")) + " " + .LeafNodeText' "$report" >&2
  exit 1
fi
if [ "$passed" -eq 0 ]; then
  echo "no PostgreSQL specs passed" >&2
  exit 1
fi
echo "$passed PostgreSQL specs passed, none skipped"

# The copier only has a second engine to copy into when a server is present,
# so its suite is proof of the same thing and belongs to the same check.
ginkgo -p --race ./internal/storage/transfer
'''

# The layers above the port open whichever engine the environment names, so with
# a DSN set this is their PostgreSQL pass. Their SQLite pass is `mise run test`,
# which sets no DSN. Running both is the point: a suite that only ever saw one
# engine proves nothing about the other.
#
# It refuses without a DSN rather than falling back. Nothing above the port
# skips when there is no server - it opens SQLite instead and passes, which
# looks exactly like a second engine having been tested.
[tasks."test:postgres"]
description = "Run the Go suite against PostgreSQL - every directory, or only the ones named"
depends = ["panel:assets:generate"]
env = { CGO_ENABLED = "1" }
run = '''
set -eu

if [ -z "${SMYKLOT_TEST_POSTGRES_DSN:-}" ]; then
  echo "SMYKLOT_TEST_POSTGRES_DSN is not set; run 'mise run db:dev' first" >&2
  exit 1
fi

ginkgo -r -p --race --fail-on-empty {{arg(name="dirs", var=true, default=".")}}
'''

[tasks."db:dev"]
description = "Start a local PostgreSQL for the storage suite and print its DSN"
run = '''
name=smyklot-pg-dev
port=55432
if [ -z "$(docker ps -aq -f name="^${name}$")" ]; then
  docker run -d --name "$name" \
    -e POSTGRES_USER=smyklot \
    -e POSTGRES_PASSWORD=smyklot \
    -e POSTGRES_DB=smyklot \
    -p "${port}:5432" \
    postgres:18-alpine >/dev/null
else
  docker start "$name" >/dev/null
fi
until docker exec "$name" pg_isready -U smyklot -q; do sleep 1; done
echo "export SMYKLOT_TEST_POSTGRES_DSN='postgres://smyklot:smyklot@localhost:${port}/smyklot?sslmode=disable'"
'''

[tasks."db:backup"]
description = "Pull a dump of the deployed database to this machine"
run = "./scripts/backup-db.sh"

[tasks.lint]
description = "Run all Smyklot linters"
depends = [
  "lint:go",
  "lint:markdown",
  "lint:mod",
  "lint:helm",
  "lint:actions",
  "lint:shell",
  "lint:matrix",
  "lint:release",
]

[tasks."lint:go"]
description = "Lint Go code"
run = '''
if [ -n "${CI:-}" ]; then
  echo "Skipping local golangci-lint; CI uses golangci-lint-action"
else
  golangci-lint run ./...
fi
'''

[tasks."lint:markdown"]
description = "Lint Markdown files"
run = "markdownlint-cli2 '**/*.md'"

[tasks."lint:mod"]
description = "Verify Go module dependencies"
run = "go mod verify"

[tasks."lint:helm"]
description = "Lint the Helm chart and prove each of its guards still refuses"
run = '''
set -eu

valid="--set github.clientId=lint --set github.existingSecret=lint --set database.existingSecret=lint"

# shellcheck disable=SC2086
helm lint charts/smyklot $valid

# A guard nothing tests is a comment. Each of these must fail to render, and
# fail for its own reason: any broken template makes helm exit non-zero, so a
# check that only asks whether rendering failed passes just as happily when the
# guard has been deleted and something unrelated is what broke. That is the way
# a guard retires without anybody noticing, which is what these exist to stop.
refuses() {
  what="$1"
  because="$2"
  shift 2
  if output=$(helm template charts/smyklot "$@" 2>&1); then
    echo "chart rendered $what" >&2
    exit 1
  fi
  if ! printf '%s' "$output" | grep -qF "$because"; then
    echo "chart refused $what, but not over $because" >&2
    printf '%s\n' "$output" >&2
    exit 1
  fi
}

# shellcheck disable=SC2086
refuses "more than one replica" "replicaCount cannot exceed 1" \
  $valid --set replicaCount=2
refuses "without a database" \
  "database.url or database.existingSecret is required" \
  --set github.clientId=lint --set github.existingSecret=lint
# shellcheck disable=SC2086
refuses "with two answers for where state lives" \
  "set database.url or database.existingSecret, not both" \
  $valid --set database.url=postgres://lint/lint
'''

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows"
run = "actionlint"

# actionlint shellchecks the run: blocks inside a workflow. Nothing was
# shellchecking the scripts beside them until the deploy checks moved into one.
[tasks."lint:shell"]
description = "Shellcheck the repository's shell scripts"
run = "shellcheck -x scripts/*.sh"

# actionlint reads whether the workflow is valid. This reads whether it is
# complete: the suites are run by a list of directories now, and a list is a
# thing a new package can be left out of without anything going red.
[tasks."lint:matrix"]
description = "Check the test workflow's matrix runs every Go suite"
run = "./scripts/check-test-matrix.sh"

# The release config decides a version number, and a wrong one is invisible:
# the release runs, the tag looks plausible, and the only symptom is a breaking
# change reaching everyone pinned to the major it broke.
[tasks."lint:release"]
description = "Check a breaking change would release a major version"
run = "./scripts/check-release-rules.sh"

[tasks.build]
description = "Build all Smyklot binaries"
depends = ["build:github-action"]

[tasks."build:github-action"]
description = "Build the Smyklot service binary"
depends = ["panel:assets:generate"]
sources = [
  "go.mod",
  "go.sum",
  "cmd/**/*.go",
  "internal/**/*.go",
  "pkg/**/*.go",
  "internal/panelassets/generated/bundle.zip",
]
outputs = ["bin/smyklot-github-action"]
run = "go build -o bin/smyklot-github-action ./cmd/github-action"

[tasks.deps]
description = "Download and verify Go dependencies"
run = '''
go mod download
go mod verify
'''

[tasks."deps:update"]
description = "Update and tidy Go dependencies"
env = { GOFLAGS = "" }
run = '''
go get -u ./...
go mod tidy
'''

[tasks."deps:tidy"]
description = "Tidy Go module metadata"
env = { GOFLAGS = "" }
run = "go mod tidy"

[tasks.generate]
description = "Run Go code generation"
run = "go generate ./..."

[tasks.clean]
description = "Remove repository-local build artifacts while preserving shared caches"
run = '''
repo_root="$(git rev-parse --show-toplevel)"
test -n "$repo_root" && test "$PWD" = "$repo_root"
rm -rf -- bin tmp/coverage dist internal/panel/frontend/dist
rm -f -- internal/panelassets/generated/bundle.zip
'''

[tasks."dev:setup"]
description = "Install pinned tools and prepare dependencies"
depends = ["deps", "panel:frontend:install"]
run = "mise install"

[tasks.fmt]
description = "Format Go code"
run = '''
go fmt ./...
gofmt -s -w $(git ls-files '*.go')
'''

[tasks.ci]
description = "Run the complete local CI dependency graph"
run = [
  { task = "lint" },
  { task = "test" },
  { task = "test:deploy" },
  { task = "test:panel-install" },
  { task = "panel:frontend:lint" },
  { task = "panel:frontend:test" },
  { task = "panel:frontend:test:browser" },
  { task = "build" },
]

[tasks."docker:build"]
description = "Build the Smyklot container image"
run = "docker build -t smyklot:latest ."

[tasks.info]
description = "Show project and toolchain information"
run = '''
echo "Project: smyklot"
echo "Module: $(go list -m)"
echo "Go version: $(go version)"
echo "Packages: $(go list ./... | wc -l | tr -d ' ')"
echo "Files: $(git ls-files '*.go' | wc -l | tr -d ' ')"
'''

[tasks."panel:frontend:install"]
description = "Install the panel frontend's pinned dependencies"
sources = ["internal/panel/frontend/package.json", "internal/panel/frontend/package-lock.json"]
outputs = [
  "internal/panel/frontend/node_modules/.package-lock.json",
  "internal/panel/frontend/.svelte-kit/tsconfig.json",
]
run = "./scripts/install-panel-frontend.sh"

[tasks."test:panel-install"]
description = "Test panel dependency cache restoration"
run = "./scripts/test-install-panel-frontend.sh"

[tasks."panel:frontend:build"]
description = "Build the panel frontend"
depends = ["panel:frontend:install"]
dir = "internal/panel/frontend"
sources = ["src/**/*", "package.json", "package-lock.json", "svelte.config.js", "vite.config.ts"]
outputs = ["dist/**/*"]
run = "npm run build"

[tasks."panel:frontend:lint"]
description = "Lint, format-check, and type-check the panel frontend"
depends = ["panel:frontend:install"]
dir = "internal/panel/frontend"
run = "npm run lint"

[tasks."panel:frontend:format"]
description = "Format the panel frontend"
depends = ["panel:frontend:install"]
dir = "internal/panel/frontend"
run = "npm run format"

[tasks."panel:frontend:test"]
description = "Run panel frontend unit tests"
depends = ["panel:frontend:install"]
dir = "internal/panel/frontend"
run = "npm test"

# Apart from the unit tests because it costs ten times what all of them cost put
# together, and `npm test` is a loop worth running on every save. It drives
# Chrome through Playwright's `channel`, so nothing is downloaded - the runner
# image ships Chrome and so does a developer's machine.
[tasks."panel:frontend:test:browser"]
description = "Drive the panel in Chrome and fail on an address asked for too often"
depends = ["panel:frontend:install"]
dir = "internal/panel/frontend"
run = "npm run test:browser"

[tasks."panel:assets:generate"]
description = "Build and package panel assets for Go embedding"
depends = ["panel:frontend:build"]
sources = ["internal/panel/frontend/dist/**/*", "internal/panelassets/cmd/generate/**/*.go"]
outputs = ["internal/panelassets/generated/bundle.zip"]
run = "go run ./internal/panelassets/cmd/generate"

[tasks."panel:dev"]
description = "Serve the panel frontend without a mock API"
depends = ["panel:frontend:install"]
dir = "internal/panel/frontend"
run = "npm run dev"

[tasks."panel:dev:mock"]
# Raises no browser. `SMYKLOT_PANEL_DEV_OPEN=1` or `--open` asks for one.
description = "Serve the panel frontend with deterministic mock data"
depends = ["panel:frontend:install"]
dir = "internal/panel/frontend"
run = "npm run dev:mock"
